<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GEBCO 2025 Bathymetry - Area of Interest</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    .page {
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      padding: 10px;
      gap: 8px;
    }
    .header {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
    }
    .status {
      font-size: 12px;
      color: #444444;
      margin-top: 2px;
      max-width: 1100px;
    }
    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    button, .file-label {
      background: #ffffff;
      color: #111111;
      border: 1px solid #777777;
      padding: 7px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.2;
    }
    button:hover, .file-label:hover {
      background: #e9e9e9;
    }
    input[type="file"] {
      display: none;
    }
    #map {
      flex: 1;
      width: 100%;
      min-height: 0;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      overflow: hidden;
      background: #ffffff;
    }
    #message {
      position: absolute;
      top: 88px;
      left: 20px;
      right: 20px;
      z-index: 5;
      padding: 12px 14px;
      border: 1px solid #b5b5b5;
      border-radius: 6px;
      background: #fff8db;
      color: #111111;
      font-size: 13px;
      line-height: 1.35;
      display: none;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div>
        <div class="title">GEBCO 2025 Bathymetry - Area of Interest</div>
        <div class="status" id="status">Starting viewer...</div>
      </div>
      <div class="controls">
        <button type="button" onclick="plot2D()">2D Relief</button>
        <button type="button" onclick="plot3D()">3D Surface</button>
        <label class="file-label" for="jsonFile">Load JSON manually</label>
        <input id="jsonFile" type="file" accept=".json,application/json" />
      </div>
    </div>
    <div id="message"></div>
    <div id="map"></div>
  </div>
  <script>
    "use strict";

    let bathyData = null;

    const defaultLeaseLon = [-117.816670, -116.066667, -116.066667, -117.816670, -117.816670];
    const defaultLeaseLat = [11.08333, 11.08333, 9.89500, 9.89500, 11.08333];

    const turboScale = [
      [0.00, "rgb(48,18,59)"],
      [0.10, "rgb(70,95,216)"],
      [0.25, "rgb(40,170,220)"],
      [0.40, "rgb(37,217,161)"],
      [0.55, "rgb(165,232,69)"],
      [0.70, "rgb(250,209,38)"],
      [0.85, "rgb(242,111,28)"],
      [1.00, "rgb(122,4,3)"]
    ];

    window.addEventListener("error", event => {
      showMessage("JavaScript error: " + event.message + "\nOpen the browser console for details.");
    });

    window.addEventListener("unhandledrejection", event => {
      showMessage("Unhandled promise error: " + event.reason + "\nOpen the browser console for details.");
    });

    document.getElementById("jsonFile").addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const rawData = JSON.parse(text);
        useRawData(rawData, "Loaded " + file.name + " manually");
      } catch (error) {
        console.error(error);
        showMessage("Could not read the selected JSON file. Error: " + error.message);
      }
    });

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function showMessage(text) {
      const message = document.getElementById("message");
      message.textContent = text;
      message.style.display = "block";
      setStatus(text.split("\n")[0]);
    }

    function hideMessage() {
      const message = document.getElementById("message");
      message.textContent = "";
      message.style.display = "none";
    }

    function assertPlotlyLoaded() {
      if (!window.Plotly) {
        throw new Error("Plotly did not load. Check internet access or allow https://cdn.plot.ly.");
      }
    }

    async function loadData() {
      try {
        assertPlotlyLoaded();
        setStatus("Loading gebco_subset.json...");
        const response = await fetch("gebco_subset.json", { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const rawData = await response.json();
        useRawData(rawData, "Loaded gebco_subset.json");
      } catch (error) {
        console.error("Startup load failed:", error);
        const localFileHint = window.location.protocol === "file:"
          ? "\n\nYou opened index.html directly from disk. Many browsers block fetch() from file:// paths. Either click 'Load JSON manually' and select gebco_subset.json, or serve the folder with: python -m http.server 8000"
          : "";
        showMessage(
          "Could not auto-load gebco_subset.json.\n" +
          "Required: index.html and gebco_subset.json must be in the same folder on the same server.\n" +
          "Error: " + error.message + localFileHint
        );
      }
    }

    function useRawData(rawData, sourceMessage) {
      hideMessage();
      bathyData = normalizeBathyData(rawData);
      const zRange = getZRange(bathyData.z);
      const status = sourceMessage + " | Lon " + minValue(bathyData.lon).toFixed(4) + " to " + maxValue(bathyData.lon).toFixed(4) +
        " | Lat " + minValue(bathyData.lat).toFixed(4) + " to " + maxValue(bathyData.lat).toFixed(4) +
        " | Z " + zRange.zMin.toFixed(1) + " to " + zRange.zMax.toFixed(1) + " m" +
        " | Grid " + bathyData.z.length + " x " + bathyData.z[0].length;
      setStatus(status);
      console.log(status);
      console.log("lon length:", bathyData.lon.length);
      console.log("lat length:", bathyData.lat.length);
      console.log("z rows:", bathyData.z.length);
      console.log("z cols:", bathyData.z[0].length);
      plot2D();
    }

    function minValue(values) {
      return Math.min(...values.filter(Number.isFinite));
    }

    function maxValue(values) {
      return Math.max(...values.filter(Number.isFinite));
    }

    function transpose(matrix) {
      return matrix[0].map((_, colIndex) => matrix.map(row => row[colIndex]));
    }

    function cleanGridValue(value) {
      if (value === null || value === undefined || value === "") return null;
      if (Array.isArray(value)) return null;
      const numericValue = Number(value);
      return Number.isFinite(numericValue) ? numericValue : null;
    }

    function normalizeBathyData(input) {
      if (!input || !Array.isArray(input.lon) || !Array.isArray(input.lat) || !Array.isArray(input.z)) {
        throw new Error("JSON must contain lon, lat, and z arrays.");
      }

      const data = {
        lon: input.lon.map(Number),
        lat: input.lat.map(Number),
        z: input.z.map(row => Array.isArray(row) ? row.map(cleanGridValue) : []),
        lease_lon: Array.isArray(input.lease_lon) ? input.lease_lon.map(Number) : defaultLeaseLon.slice(),
        lease_lat: Array.isArray(input.lease_lat) ? input.lease_lat.map(Number) : defaultLeaseLat.slice(),
        lonlim: Array.isArray(input.lonlim) ? input.lonlim.map(Number) : null,
        latlim: Array.isArray(input.latlim) ? input.latlim.map(Number) : null,
        color_min: Number.isFinite(Number(input.color_min)) ? Number(input.color_min) : null,
        color_max: Number.isFinite(Number(input.color_max)) ? Number(input.color_max) : null
      };

      if (!data.lon.length || !data.lat.length || !data.z.length || !data.z[0].length) {
        throw new Error("The JSON file has empty lon, lat, or z arrays.");
      }

      if (data.z.length === data.lon.length && data.z[0].length === data.lat.length) {
        data.z = transpose(data.z);
      }

      if (data.z.length !== data.lat.length || data.z[0].length !== data.lon.length) {
        throw new Error("Dimension mismatch: z is " + data.z.length + " x " + data.z[0].length +
          ", lat length is " + data.lat.length + ", lon length is " + data.lon.length + ".");
      }

      if (data.lat[0] > data.lat[data.lat.length - 1]) {
        data.lat.reverse();
        data.z.reverse();
      }

      if (data.lon[0] > data.lon[data.lon.length - 1]) {
        data.lon.reverse();
        data.z = data.z.map(row => row.slice().reverse());
      }

      return data;
    }

    function getZRange(z) {
      let zMin = Infinity;
      let zMax = -Infinity;
      for (let i = 0; i < z.length; i++) {
        for (let j = 0; j < z[i].length; j++) {
          const value = z[i][j];
          if (Number.isFinite(value)) {
            zMin = Math.min(zMin, value);
            zMax = Math.max(zMax, value);
          }
        }
      }
      if (!Number.isFinite(zMin) || !Number.isFinite(zMax)) {
        throw new Error("No finite elevation values were found in z.");
      }
      return { zMin, zMax };
    }

    function getColorRange() {
      const autoRange = getZRange(bathyData.z);
      const zMin = Number.isFinite(bathyData.color_min) ? bathyData.color_min : autoRange.zMin;
      const zMax = Number.isFinite(bathyData.color_max) ? bathyData.color_max : autoRange.zMax;
      return { zMin, zMax };
    }

    function getAxisBounds() {
      const lonMin = Math.min(minValue(bathyData.lon), minValue(bathyData.lease_lon));
      const lonMax = Math.max(maxValue(bathyData.lon), maxValue(bathyData.lease_lon));
      const latMin = Math.min(minValue(bathyData.lat), minValue(bathyData.lease_lat));
      const latMax = Math.max(maxValue(bathyData.lat), maxValue(bathyData.lease_lat));
      return { lonMin, lonMax, latMin, latMax };
    }

    function plot2D() {
      try {
        assertPlotlyLoaded();
        if (!bathyData) {
          showMessage("No bathymetry data loaded yet. Load gebco_subset.json first.");
          return;
        }

        hideMessage();
        const { lon, lat, z, lease_lon, lease_lat } = bathyData;
        const { zMin, zMax } = getColorRange();
        const { lonMin, lonMax, latMin, latMax } = getAxisBounds();

        const heatmap = {
          type: "heatmap",
          x: lon,
          y: lat,
          z: z,
          colorscale: turboScale,
          zmin: zMin,
          zmax: zMax,
          zsmooth: "best",
          connectgaps: false,
          colorbar: { title: { text: "Elevation (m)" } },
          hovertemplate: "Lon: %{x:.5f}<br>Lat: %{y:.5f}<br>Elev: %{z:.1f} m<extra></extra>",
          name: "GEBCO elevation"
        };

        const contours = {
          type: "contour",
          x: lon,
          y: lat,
          z: z,
          showscale: false,
          contours: { coloring: "none", showlines: true },
          line: { color: "rgba(0,0,0,0.32)", width: 0.6 },
          hoverinfo: "skip",
          name: "Contours"
        };

        const leaseBoundary = {
          type: "scatter",
          mode: "lines",
          x: lease_lon,
          y: lease_lat,
          line: { color: "red", width: 3 },
          name: "Lease Boundary",
          hovertemplate: "Lease Boundary<br>Lon: %{x:.5f}<br>Lat: %{y:.5f}<extra></extra>"
        };

        const layout = {
          title: { text: "GEBCO 2025 Bathymetry - Area of Interest", font: { color: "#111111", size: 16 } },
          paper_bgcolor: "#ffffff",
          plot_bgcolor: "#ffffff",
          font: { color: "#111111" },
          margin: { l: 70, r: 30, t: 50, b: 60 },
          xaxis: {
            title: "Longitude",
            range: [lonMin, lonMax],
            showgrid: true,
            gridcolor: "rgba(0,0,0,0.18)",
            zeroline: false,
            showline: true,
            linecolor: "#222222",
            tickcolor: "#222222",
            constrain: "domain"
          },
          yaxis: {
            title: "Latitude",
            range: [latMin, latMax],
            showgrid: true,
            gridcolor: "rgba(0,0,0,0.18)",
            zeroline: false,
            showline: true,
            linecolor: "#222222",
            tickcolor: "#222222",
            scaleanchor: "x",
            scaleratio: 1
          },
          legend: { bgcolor: "rgba(255,255,255,0.75)", bordercolor: "rgba(0,0,0,0.2)", borderwidth: 1 }
        };

        Plotly.newPlot("map", [heatmap, contours, leaseBoundary], layout, {
          responsive: true,
          displaylogo: false,
          scrollZoom: true
        });
      } catch (error) {
        console.error(error);
        showMessage("Could not draw the 2D plot. Error: " + error.message);
      }
    }

    function nearestIndex(values, target) {
      let bestIndex = 0;
      let bestDistance = Infinity;
      for (let i = 0; i < values.length; i++) {
        const distance = Math.abs(values[i] - target);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = i;
        }
      }
      return bestIndex;
    }

    function interpolateNearestElevation(lonValue, latValue) {
      if (!bathyData) return null;
      const i = nearestIndex(bathyData.lat, latValue);
      const j = nearestIndex(bathyData.lon, lonValue);
      const value = bathyData.z[i][j];
      return Number.isFinite(value) ? value : null;
    }

    function plot3D() {
      try {
        assertPlotlyLoaded();
        if (!bathyData) {
          showMessage("No bathymetry data loaded yet. Load gebco_subset.json first.");
          return;
        }

        hideMessage();
        const { lon, lat, z, lease_lon, lease_lat } = bathyData;
        const { zMin, zMax } = getColorRange();

        const lon0 = lon.reduce((a, b) => a + b, 0) / lon.length;
        const lat0 = lat.reduce((a, b) => a + b, 0) / lat.length;
        const kmPerDegLat = 111.32;
        const kmPerDegLon = 111.32 * Math.cos(lat0 * Math.PI / 180);
        const xKm = lon.map(value => (value - lon0) * kmPerDegLon);
        const yKm = lat.map(value => (value - lat0) * kmPerDegLat);
        const verticalExaggeration = 8;
        const zKmExag = z.map(row => row.map(value => Number.isFinite(value) ? (value / 1000) * verticalExaggeration : null));

        const surface = {
          type: "surface",
          x: xKm,
          y: yKm,
          z: zKmExag,
          surfacecolor: z,
          cmin: zMin,
          cmax: zMax,
          colorscale: turboScale,
          colorbar: { title: { text: "Elevation (m)" } },
          contours: { z: { show: true, usecolormap: true, highlightcolor: "white", project: { z: true } } },
          lighting: { ambient: 0.35, diffuse: 0.85, specular: 0.15, roughness: 0.65, fresnel: 0.2 },
          lightposition: { x: 100, y: 200, z: 1000 },
          customdata: z,
          hovertemplate: "X: %{x:.2f} km<br>Y: %{y:.2f} km<br>Elevation: %{customdata:.1f} m<extra></extra>",
          name: "GEBCO Bathymetry"
        };

        const leaseXKm = lease_lon.map(value => (value - lon0) * kmPerDegLon);
        const leaseYKm = lease_lat.map(value => (value - lat0) * kmPerDegLat);
        const leaseZKm = lease_lon.map((value, index) => {
          const elevation = interpolateNearestElevation(value, lease_lat[index]);
          return Number.isFinite(elevation) ? (elevation / 1000) * verticalExaggeration + 0.03 : 0.03;
        });

        const leaseBoundary3D = {
          type: "scatter3d",
          mode: "lines",
          x: leaseXKm,
          y: leaseYKm,
          z: leaseZKm,
          line: { color: "red", width: 8 },
          name: "Lease Boundary",
          hovertemplate: "Lease Boundary<br>X: %{x:.2f} km<br>Y: %{y:.2f} km<extra></extra>"
        };

        const layout = {
          title: { text: "GEBCO 2025 3D Bathymetry Relief - Vertical Exaggeration x" + verticalExaggeration, font: { color: "#111111", size: 16 } },
          paper_bgcolor: "#ffffff",
          plot_bgcolor: "#ffffff",
          font: { color: "#111111" },
          margin: { l: 0, r: 0, t: 50, b: 0 },
          scene: {
            bgcolor: "#ffffff",
            xaxis: { title: "East-West Distance (km)", backgroundcolor: "#ffffff", gridcolor: "#d0d0d0", zerolinecolor: "#777777", color: "#111111" },
            yaxis: { title: "North-South Distance (km)", backgroundcolor: "#ffffff", gridcolor: "#d0d0d0", zerolinecolor: "#777777", color: "#111111" },
            zaxis: { title: "Elevation x" + verticalExaggeration + " (km)", backgroundcolor: "#ffffff", gridcolor: "#d0d0d0", zerolinecolor: "#777777", color: "#111111" },
            aspectmode: "manual",
            aspectratio: { x: 1.35, y: 1.0, z: 0.45 },
            camera: { eye: { x: 1.55, y: -1.65, z: 0.85 }, center: { x: 0, y: 0, z: -0.15 } }
          },
          legend: { bgcolor: "rgba(255,255,255,0.75)", bordercolor: "rgba(0,0,0,0.2)", borderwidth: 1 }
        };

        Plotly.newPlot("map", [surface, leaseBoundary3D], layout, {
          responsive: true,
          displaylogo: false,
          scrollZoom: true
        });
      } catch (error) {
        console.error(error);
        showMessage("Could not draw the 3D plot. Error: " + error.message);
      }
    }

    loadData();
  </script>
</body>
</html>
